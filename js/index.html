<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trace one merchandise cycle from the supplier's dock to the financial statements.">
  <title>Dock to Dollar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📦%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./original.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#lesson">Skip to the activity</a>
  <main class="block-container">
    <div id="hero"></div>
    <div class="utility-row">
      <details class="activity-menu">
        <summary>Activity</summary>
        <div class="activity-options">
          <strong>Gem City Goods</strong>
          <p>Progress is saved anonymously in this page's address so a refresh does not erase your work.</p>
          <button id="reset" type="button" disabled>Start over</button>
        </div>
      </details>
      <nav class="review-navigation" aria-label="Review reached pages">
        <span id="page-counter" class="caption"></span>
        <button id="back" class="arrow" type="button" aria-label="Back" title="Back: review the previous reached page. Earlier pages are read-only." disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5m0 0 7-7m-7 7 7 7"/></svg>
        </button>
        <button id="forward" class="arrow" type="button" aria-label="Forward" title="Forward: review the next reached page. Stops at your current page." disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m0 0-7-7m7 7-7 7"/></svg>
        </button>
      </nav>
    </div>
    <p id="save-error" class="notice warning" role="alert" hidden></p>
    <div id="stages" class="stage-row" aria-label="Case phases"></div>
    <div id="review-message" aria-live="polite"></div>
    <section id="lesson" tabindex="-1" aria-label="Dock to Dollar activity" aria-busy="true"></section>
    <noscript><p class="notice warning">Enable JavaScript to open Dock to Dollar.</p></noscript>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
